<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KU-Emotion - Giriş və Qeydiyyat</title>

    <style>
        :root {
            --bg-color: #0a0a0c;   
            --card-bg: #121216;       
            --accent-color: #00ff66;   
            --text-main: #ffffff;     
            --text-muted: #88889b;     
            --input-bg: #1a1a22;    
            --input-border: #2a2a35;    
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Arxa fondakı yüngül kursor/işıq effekti */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 255, 102, 0.05) 0%, transparent 70%);
            top: 10%;
            left: 10%;
            pointer-events: none;
        }

        /* Giriş/Qeydiyyat Konteyneri */
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        /* Minimalist Form Qutusu */
        .form-box {
            background-color: var(--card-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .form-box:hover {
            border-color: rgba(0, 255, 102, 0.3);
            box-shadow: 0 8px 32px rgba(0, 255, 102, 0.05);
        }

        .form-box h2 {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Giriş Xanaları */
        form input {
            width: 100%;
            padding: 12px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 15px;
            margin-bottom: 16px;
            outline: none;
            transition: all 0.2s ease;
        }

        form input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(0, 255, 102, 0.1);
        }

        form input::placeholder {
            color: var(--text-muted);
        }

        /* Müasir Düymə */
        form button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        form button:hover {
            background-color: #00dd55;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 255, 102, 0.2);
        }

        form button:active {
            transform: translateY(0);
        }

        /* Keçid Linkləri */
        p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 20px;
            text-align: center;
        }

        p a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        p a:hover {
            text-decoration: underline;
            color: #00dd55;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Qeydiyyat Formu -->
        <div class="form-box" id="signup-box">
            <h2>Hesab Yarat</h2>
            <form id="signup-form">
                <input type="text" id="signup-username" placeholder="Ad və Soyadınız" required>
                <input type="email" id="signup-email" placeholder="Tələbə e-poçtu" required>
                <input type="password" id="signup-password" placeholder="Şifrəniz" required>
                <button type="submit">Qeydiyyatdan Keç</button>
            </form>
            <p>Artıq hesabınız var? <a href="#" id="to-login">Daxil olun</a></p>
        </div>

        <!-- Giriş Formu -->
        <div class="form-box" id="login-box" style="display: none;">
            <h2>Daxil Ol</h2>
            <form id="login-form">
                <input type="email" id="login-email" placeholder="E-poçt ünvanınız" required>
                <input type="password" id="login-password" placeholder="Şifrəniz" required>
                <button type="submit">Giriş Et</button>
            </form>
            <p>Hesabınız yoxdur? <a href="#" id="to-signup">Qeydiyyatdan keçin</a></p>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loginBox = document.getElementById('login-box');
        const signupBox = document.getElementById('signup-box');
        const toLoginLink = document.getElementById('to-login');
        const toSignupLink = document.getElementById('to-signup');

        const API_BASE_URL = 'http://127.0.0.1:5050/api';

        // --- EKRANLAR ARASI KEÇİD MƏNTİQİ ---
        if (toLoginLink) {
            toLoginLink.addEventListener('click', (e) => {
                e.preventDefault();
                signupBox.style.display = 'none';
                loginBox.style.display = 'block';
            });
        }

        if (toSignupLink) {
            toSignupLink.addEventListener('click', (e) => {
                e.preventDefault();
                loginBox.style.display = 'none';
                signupBox.style.display = 'block';
            });
        }

        // --- REAL BACKEND QEYDİYYAT SORĞUSU ---
        const signupForm = document.getElementById('signup-form');
        if (signupForm) {
            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const username = document.getElementById('signup-username').value;
                const email = document.getElementById('signup-email').value;
                const password = document.getElementById('signup-password').value;

                // 💡 JavaScript üçün uyğunlaşdırılmış təhlükəsiz regex formatı
                const quEmailPattern = /^(s|st)\d{6}@qu\.edu\.az$/i;
                if (!quEmailPattern.test(email)) {
                    alert('Xəta: Yalnız S123456@qu.edu.az və ya ST123456@qu.edu.az formatında e-poçtlar qəbul edilir!');
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE_URL}/register`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ name: username, email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        alert(data.message || 'Qeydiyyat uğurludur! İndi daxil ola bilərsiniz.');
                        signupForm.reset();
                        signupBox.style.display = 'none';
                        loginBox.style.display = 'block';
                    } else {
                        alert(`Xəta: ${data.message || 'Qeydiyyat baş tutmadı.'}`);
                    }
                } catch (error) {
                    console.error('Sorğu xətası:', error);
                    alert('Backend serverinə qoşulmaq mümkün olmadı.');
                }
            });
        }

        // --- REAL BACKEND GİRİŞ SORĞUSU ---
        const loginForm = document.getElementById('login-form');
        if (loginForm) {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('login-email').value;
                const password = document.getElementById('login-password').value;

                try {
                    const response = await fetch(`${API_BASE_URL}/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        localStorage.setItem('userToken', data.token);
                        localStorage.setItem('userData', JSON.stringify(data.user));

                        loginForm.reset();
                        window.location.href = 'dashboard.html';
                    } else {
                        alert(`Xəta: ${data.message || 'Giriş uğursuz oldu.'}`);
                    }
                } catch (error) {
                    console.error('Sorğu xətası:', error);
                    alert('Backend serverinə qoşulmaq mümkün olmadı.');
                }
            });
        }
    });
</script>

</body>
</html>
